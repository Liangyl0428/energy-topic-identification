<div id="energy-p2-preview">
<style>
#energy-p2-preview{--ep-bg:light-dark(#f4f7f8,#151b22);--ep-panel:light-dark(#ffffff,#202833);--ep-fg:light-dark(#142a3a,#edf4fa);--ep-muted:light-dark(#526877,#b3c3cf);--ep-line:light-dark(#dbe5e9,#394653);--ep-accent:light-dark(#087f73,#5ed1bf);--ep-soft:light-dark(#e9f5f2,#243e3a);color:var(--ep-fg);background:var(--ep-bg);font:14px/1.65 system-ui,sans-serif;border-radius:16px;overflow:hidden;color-scheme:light dark}
#energy-p2-preview *{box-sizing:border-box}#energy-p2-preview header{padding:24px 28px;background:var(--ep-panel);border-bottom:1px solid var(--ep-line)}#energy-p2-preview .ep-brand{font-size:12px;letter-spacing:.15em;color:var(--ep-accent)}#energy-p2-preview h1{font-size:26px;font-weight:500;margin:7px 0}#energy-p2-preview h2{font-size:21px;font-weight:500;margin:0 0 12px}#energy-p2-preview h3{font-size:15px;font-weight:500;margin:0 0 8px}#energy-p2-preview p{margin:8px 0}#energy-p2-preview .ep-sub{color:var(--ep-muted);font-size:12px}#energy-p2-preview nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}#energy-p2-preview button,#energy-p2-preview input,#energy-p2-preview select{font:inherit;color:var(--ep-fg);border:1px solid var(--ep-line);border-radius:8px;background:var(--ep-panel);padding:8px 12px;max-width:100%}#energy-p2-preview button[aria-pressed=true]{background:var(--ep-accent);color:light-dark(#fff,#122720);border-color:var(--ep-accent)}#energy-p2-preview button:focus-visible,#energy-p2-preview input:focus-visible,#energy-p2-preview select:focus-visible{outline:3px solid var(--ep-accent);outline-offset:2px}#energy-p2-preview main{display:grid;grid-template-columns:245px minmax(0,1fr);gap:20px;padding:22px}#energy-p2-preview aside{min-width:0}#energy-p2-preview label{display:block;color:var(--ep-muted);font-size:12px;margin-bottom:6px}#energy-p2-preview input,#energy-p2-preview select{width:100%;margin-bottom:12px}#energy-p2-preview .ep-panel{background:var(--ep-panel);border:1px solid var(--ep-line);border-radius:12px;padding:18px;margin-bottom:14px;overflow-wrap:anywhere}#energy-p2-preview .ep-kicker{color:var(--ep-accent);font-size:12px;margin-bottom:8px}#energy-p2-preview .ep-callout{padding:13px 15px;background:var(--ep-soft);border-radius:8px;margin:12px 0}#energy-p2-preview .ep-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}#energy-p2-preview .ep-value{font-size:24px;font-variant-numeric:tabular-nums}#energy-p2-preview .ep-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}#energy-p2-preview ul{padding-left:19px;margin:8px 0}#energy-p2-preview li{margin:6px 0}#energy-p2-preview a{color:var(--ep-accent)}#energy-p2-preview details{border-top:1px solid var(--ep-line);padding:12px 0}#energy-p2-preview summary{font-weight:500;overflow-wrap:anywhere}#energy-p2-preview .ep-chart{width:100%;height:190px;display:block}#energy-p2-preview .ep-chart text{font:11px system-ui;fill:var(--ep-muted)}#energy-p2-preview .ep-chart rect{fill:var(--ep-accent)}#energy-p2-preview .ep-chart line{stroke:var(--ep-line)}#energy-p2-preview .ep-empty{color:var(--ep-muted);padding:20px 0}#energy-p2-preview .ep-badge{display:inline-block;padding:2px 8px;border-radius:5px;background:var(--ep-soft);color:var(--ep-accent);font-size:12px;margin-right:6px}#energy-p2-preview .ep-footer{padding:0 24px 20px;color:var(--ep-muted);font-size:12px}#energy-p2-preview .ep-results{display:grid;gap:6px}#energy-p2-preview .ep-results button{text-align:left}#energy-p2-preview .ep-pager{display:flex;gap:8px;align-items:center;margin-top:12px}#energy-p2-preview .ep-pager span{font-size:12px;color:var(--ep-muted)}
@media(max-width:720px){#energy-p2-preview main{grid-template-columns:1fr;padding:14px}#energy-p2-preview header{padding:18px}#energy-p2-preview .ep-cols{grid-template-columns:1fr}#energy-p2-preview .ep-metrics{gap:7px}#energy-p2-preview .ep-value{font-size:20px}#energy-p2-preview button{min-height:44px}#energy-p2-preview .ep-results{grid-template-columns:1fr 1fr}#energy-p2-preview input,#energy-p2-preview select{font-size:16px}}
</style>
<header><div class="ep-brand">ENERGY RESEARCH · 业务解读预览</div><h1>从研究信号到下一步行动</h1><div class="ep-sub" data-role="coverage"></div><nav aria-label="内容类型"><button type="button" data-mode="topics" aria-pressed="true">能源业务主题</button><button type="button" data-mode="cases" aria-pressed="false">具体技术对象</button><button type="button" data-mode="legacy" aria-pressed="false">F 编号追溯</button></nav></header>
<main><aside><label for="ep-search">搜索主题、对象或编号</label><input id="ep-search" type="search" placeholder="如：电力市场、风电、F0022"><label for="ep-category">业务分类</label><select id="ep-category"><option value="">全部业务</option></select><div class="ep-results" data-role="list"></div><div class="ep-pager"><button type="button" data-role="prev" aria-label="上一页">上一页</button><span data-role="page"></span><button type="button" data-role="next" aria-label="下一页">下一页</button></div></aside><section data-role="detail" aria-live="polite"></section></main>
<div class="ep-footer">本地交付预览 · 趋势截至 2026-06-30，成熟度证据截至 2026-09-25。规则筛选与对象关联待领域复核；未知等级不等于技术落后。</div>
<script type="application/json" data-role="data">__ENERGY_P2_DATA__</script>
<script>
(()=>{
const root=document.getElementById('energy-p2-preview');const data=JSON.parse(root.querySelector('[data-role=data]').textContent);
const $=s=>root.querySelector(s), e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('zh-CN'),pct=n=>(100*n).toFixed(3)+'%', safeURL=u=>/^https?:\/\//i.test(u||'')?u:null;
let mode='topics',selected='G01',offset=0,filtered=[];
const perPage=8;const detail=$('[data-role=detail]');
$('[data-role=coverage]').textContent=`${data.summary.business_topics} 个业务主题 · ${fmt(data.summary.population_records)} 条冻结记录已筛选 · ${data.summary.object_cards} 个对象解读`;
Object.entries(data.categories).forEach(([v,n])=>{const o=document.createElement('option');o.value=v;o.textContent=n;$('#ep-category').appendChild(o)});
const name=r=>mode==='topics'?r.name:mode==='cases'?r.canonical_name:r.category_id+' · '+r.name;
const id=r=>mode==='topics'?r.business_topic_id:mode==='cases'?r.case_id:r.category_id;
const listHTML=xs=>'<ul>'+xs.map(x=>'<li>'+e(x)+'</li>').join('')+'</ul>';
function chart(t){const values=t.quarter_counts;const max=Math.max(1,...values.map(x=>x.papers));const w=Math.max(240,detail.clientWidth-38),h=190,left=48,right=12,top=18,bottom=36,step=(w-left-right)/values.length;return '<svg class="ep-chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="2021年第三季度至2026年第二季度，题名筛选论文逐季数量"><line x1="'+left+'" y1="'+(h-bottom)+'" x2="'+(w-right)+'" y2="'+(h-bottom)+'"/>'+[0,.5,1].map(v=>'<text x="'+(left-7)+'" y="'+(h-bottom-v*(h-bottom-top)+4)+'" text-anchor="end">'+fmt(Math.round(max*v))+'</text>').join('')+values.map((v,i)=>{const bh=(v.papers/max)*(h-top-bottom);return '<rect x="'+(left+i*step+3)+'" y="'+(h-bottom-bh)+'" width="'+(step-6)+'" height="'+bh+'"><title>'+e(v.period)+'：'+fmt(v.papers)+' 篇；份额 '+pct(v.share)+'</title></rect>'+(i%(w<450?7:5)===0||i===values.length-1?'<text x="'+(left+(i+.5)*step)+'" y="'+(h-12)+'" text-anchor="middle">'+e(v.period)+'</text>':'')}).join('')+'</svg>'}
function topic(t){const ev=data.evidence.filter(x=>x.business_topic_id===t.business_topic_id);const cases=data.cases.filter(x=>x.business_links.some(l=>l.business_topic_id===t.business_topic_id));
detail.innerHTML='<div class="ep-panel"><div class="ep-kicker">'+e(t.category_name)+' / '+e(t.business_topic_id)+'</div><h2>'+e(t.name)+'</h2><span class="ep-badge">'+e(t.signal)+'</span><span class="ep-badge">题名筛选 · 待领域复核</span><p>'+e(t.definition)+'</p><div class="ep-callout"><h3>辅助决策的问题</h3>'+e(t.decision_question)+'</div><div class="ep-metrics"><div><div class="ep-sub">近期论文</div><div class="ep-value">'+fmt(t.recent_papers)+'</div><div class="ep-sub">前期 '+fmt(t.previous_papers)+' 篇</div></div><div><div class="ep-sub">份额为前期</div><div class="ep-value">'+(t.share_growth_ratio===null?'未定义':t.share_growth_ratio.toFixed(2)+' 倍')+'</div><div class="ep-sub">当前 '+pct(t.recent_share)+'</div></div><div><div class="ep-sub">近期参与机构</div><div class="ep-value">'+fmt(t.recent_institutions)+'</div><div class="ep-sub">前期 '+fmt(t.previous_institutions)+' 家</div></div></div>'+chart(t)+'<p class="ep-sub">近期：2025-07—2026-06；前期：2024-07—2025-06。机构按名称归一，非作者人数。分母为同期冻结文献池的去重合格论文。</p></div><div class="ep-panel"><h3>研究趋势与行动</h3><p>'+e(t.decision_interpretation)+'</p>'+listHTML(t.recommended_actions)+'<div class="ep-cols"><div><h3>发展机会：需要验证什么</h3><p>'+e(t.potential_assessment.opportunity_to_investigate)+'</p></div><div><h3>关键瓶颈</h3><p>'+e(t.bottleneck_to_check)+'</p></div></div><p class="ep-sub">以上机会与瓶颈是研究判断框架，尚无已验证的未来预测或商业潜力分。</p></div><div class="ep-panel"><h3>代表证据 · 固定抽样</h3>'+ev.map(d=>'<details><summary>'+e(d.title)+'</summary><p class="ep-sub">'+e(d.source)+' · '+e(d.date)+' · '+e(d.doc_id)+'</p><p>题名命中：'+d.matched_quotes.map(e).join(' / ')+'</p><p>'+e(d.body_excerpt||'本地记录没有摘要。')+'</p>'+(safeURL(d.url)?'<a target="_blank" rel="noopener noreferrer" href="'+e(d.url)+'">查看来源</a>':'<p class="ep-sub">来源地址见证据文件。</p>')+'</details>').join('')+'</div><div class="ep-panel"><h3>候选关联技术对象</h3>'+(cases.length?cases.map(c=>'<button type="button" data-case="'+e(c.case_id)+'">'+e(c.canonical_name)+' · '+e(c.trl_display)+' / '+e(c.crl_display)+'</button>').join(' '):'<p class="ep-empty">暂无按对象文本匹配的案例；不表示该方向没有成熟技术。</p>')+'<details><summary>统计范围与边界</summary>'+listHTML(t.limitations)+'</details></div>';
root.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{mode='cases';selected=b.dataset.case;$('#ep-search').value='';$('#ep-category').value='';offset=0;render()});}
function caseView(c){detail.innerHTML='<div class="ep-panel"><div class="ep-kicker">具体配置 / '+e(c.case_id)+'</div><h2>'+e(c.canonical_name)+'</h2><span class="ep-badge">公开证据初评</span><div class="ep-metrics"><div><div class="ep-sub">技术验证</div><div class="ep-value">'+(c.trl_public_evidence_stage===null?'未知':'TRL '+c.trl_public_evidence_stage)+'</div><p>'+e(c.trl_stage_name||'证据不足')+'</p></div><div><div class="ep-sub">商业活动</div><div class="ep-value">'+(c.crl_public_evidence_stage===null?'未知':'CRL '+c.crl_public_evidence_stage)+'</div><p>'+e(c.crl_stage_name||'证据不足')+'</p></div><div><div class="ep-sub">下一步</div><p>'+e(c.decision_stage)+'</p></div></div><p><b>配置：</b>'+e(c.object_configuration)+'</p><p><b>场景：</b>'+e(c.application_or_target_function)+'</p><p><b>证据期间：</b>'+e(c.evidence_period)+'</p><p class="ep-sub">'+e(c.boundary)+'</p></div><div class="ep-panel"><h3>这对决策意味着什么</h3><p>'+e(c.decision_brief)+'</p><h3>对象核查清单</h3>'+listHTML(c.specific_questions)+listHTML(c.application_checks)+'<h3>技术与商业的下一步</h3>'+listHTML([...c.trl_next_actions,...c.crl_next_actions])+'</div><div class="ep-panel"><h3>证据来源</h3>'+c.evidence_links.map(l=>safeURL(l.url)?'<p><a href="'+e(l.url)+'" target="_blank" rel="noopener noreferrer">'+e(l.evidence_id)+' · 公开原始来源</a></p>':'<p>'+e(l.evidence_id)+'</p>').join('')+'<p class="ep-sub">未新增外部商业证据；对象等级不外推给整个主题。</p></div>'}
function legacy(f){detail.innerHTML='<div class="ep-panel"><div class="ep-kicker">算法聚类 / '+e(f.category_id)+'</div><h2>'+e(f.name)+'</h2><p>'+e(f.interpretation)+'</p><div class="ep-metrics"><div><div class="ep-sub">原论文数</div><div class="ep-value">'+fmt(f.paper_documents)+'</div></div><div><div class="ep-sub">明确任务命中（去重）</div><div class="ep-value">'+fmt(f.matched_unique_papers)+'</div></div><div><div class="ep-sub">待补充范围判断</div><div class="ep-value">'+fmt(f.unresolved_papers)+'</div></div></div><p class="ep-sub">尚未命中不等于能源无关；各任务允许交叉，下面的数量不能相加。</p></div><div class="ep-panel"><h3>逐篇筛选后的业务构成</h3>'+f.business_composition.map(b=>'<p><button type="button" data-topic="'+e(b.business_topic_id)+'">'+e(b.name)+' · '+fmt(b.documents)+' 篇</button></p>').join('')+'</div>';root.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{mode='topics';selected=b.dataset.topic;$('#ep-search').value='';$('#ep-category').value='';offset=0;render()})}
function render(){root.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));$('#ep-category').disabled=mode!=='topics';const query=$('#ep-search').value.trim().toLowerCase(),cat=$('#ep-category').value;filtered=data[mode].filter(r=>(mode!=='topics'||!cat||r.category===cat)&&JSON.stringify([name(r),id(r),r.research_object]).toLowerCase().includes(query));if(!filtered.some(r=>id(r)===selected))selected=filtered.length?id(filtered[0]):null;offset=Math.max(0,Math.min(offset,Math.floor(Math.max(0,filtered.length-1)/perPage)*perPage));$('[data-role=list]').innerHTML=filtered.slice(offset,offset+perPage).map(r=>'<button type="button" aria-pressed="'+String(id(r)===selected)+'" data-select="'+e(id(r))+'">'+e(name(r))+'</button>').join('');root.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selected=b.dataset.select;render()});$('[data-role=page]').textContent=filtered.length?`${Math.floor(offset/perPage)+1} / ${Math.ceil(filtered.length/perPage)}`:'0 / 0';$('[data-role=prev]').disabled=offset===0;$('[data-role=next]').disabled=offset+perPage>=filtered.length;const r=filtered.find(r=>id(r)===selected);if(!r){detail.innerHTML='<div class="ep-panel">没有匹配结果，请调整搜索词。</div>';return}if(mode==='topics')topic(r);else if(mode==='cases')caseView(r);else legacy(r)}
root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;offset=0;selected=null;$('#ep-search').value='';render()});$('#ep-search').oninput=()=>{offset=0;render()};$('#ep-category').onchange=()=>{offset=0;render()};$('[data-role=prev]').onclick=()=>{offset-=perPage;render()};$('[data-role=next]').onclick=()=>{offset+=perPage;render()};render();let lastWidth=detail.clientWidth;new ResizeObserver(()=>{if(detail.clientWidth!==lastWidth){lastWidth=detail.clientWidth;render()}}).observe(detail);
})();
</script>
</div>
