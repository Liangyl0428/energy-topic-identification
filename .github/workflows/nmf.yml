name: Keyword NMF regression and release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-nmf500.txt -r requirements.txt duckdb threadpoolctl openpyxl
      - run: python -m pytest tests -q --import-mode=importlib --ignore=tests/test_embedding_pool.py --ignore=tests/test_topic_components.py
      - run: python tools/validate_release.py
      - run: python tools/check_platform_assets.py
